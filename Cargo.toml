[package]
name = "regex-splitter"
version = "1.0.1"
edition = "2024"
authors = ["Chris Palmer <chris@noncombatant.org>"]
license-file = "LICENSE"
description = """
This crate provides an `Iterator` that scans a `Read` looking for instances of
a `Regex` delimiter, and yields the bytes between instances of the delimiter.
"""
repository = "https://github.com/noncombatant/regex-splitter"
homepage = "https://github.com/noncombatant/regex-splitter"
readme = "README.md"
categories = ["text-processing"]
keywords = ["regex", "iterator", "read", "chunking", "lexing", "scanning"]

[dependencies]
regex = "1.13.1"

[dev-dependencies]
tempfile = "3.14.0"

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"

[[bin]]
name = "readme"
